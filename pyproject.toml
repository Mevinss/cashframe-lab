[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cashframe-lab"
version = "0.2.0"
description = "Local video review research and evidence workflow"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.2", "Pillow==12.3.0", "psutil==7.2.2", "fastapi==0.143.3", "starlette==1.8.0", "uvicorn==0.37.0", "python-multipart==0.0.32", "pydantic==2.14.1", "reportlab==4.4.10"]

[project.scripts]
cashframe = "cashframe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cashframe = ["assets/fonts/*.ttf", "assets/fonts/LICENSE*"]
