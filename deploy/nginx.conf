# Replace domain and certificate paths; this file is a deployment template.
server {
    listen 80;
    server_name cashframe.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name cashframe.example.org;
    ssl_certificate /etc/letsencrypt/live/cashframe.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cashframe.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 101m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_request_buffering off;
    }
    # Never serve project/local directories through Nginx aliases.
}
